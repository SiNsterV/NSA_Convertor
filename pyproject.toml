[project]
name = "notebridge"
version = "0.2.0b1"
description = "Convert Noteshelf and Notein backups into PDFs with a Windows desktop app"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.3",
    "pymupdf>=1.26.7",
    "python-dotenv>=1.2.1",
    "pyside6>=6.8,<7",
    "keyring>=25,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
